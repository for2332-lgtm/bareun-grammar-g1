
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바른그래머 · 고1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --deepest:#4D2D7A; --deep:#804CAD; --mid:#C698E0; --soft:#F5EAFA;
    --gold:#C4955A; --ink:#2B2240; --line:#DCCDED; --boxbg:#F8F5FC; --paper:#EDE6F4;
    --wrong-bg:#FBF1F1; --wrong-border:#E7C9C9; --wrong-ink:#9B4B4B;
    --ok-bg:#F0F7F0; --ok-border:#C8E0C8; --ok-ink:#3E7A45;
    --pen:#1A1A1A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 100px;}
  .sheet{background:#fff;border-radius:16px;padding:22px 24px 20px;position:relative;box-shadow:0 6px 28px rgba(77,45,122,.14);overflow:hidden;}

  /* header (VIOLET 공통) */
  .phead{border-top:4px solid var(--deep);padding-top:11px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .pleft{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;letter-spacing:3px;color:var(--deepest);line-height:1;}
  .pcenter{text-align:center;flex:1;}
  .pcenter .t1{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:5px;color:var(--deep);}
  .t1-ko{font-family:'Noto Sans KR',sans-serif!important;font-weight:800!important;letter-spacing:6px!important;}
  .pcenter .t2{font-size:10.5px;color:var(--gold);letter-spacing:1px;margin-top:2px;}
  .pright{text-align:right;font-size:10.5px;color:#7A6E92;line-height:1.45;white-space:nowrap;}
  .pright b{color:var(--deepest);}
  .goldline{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:6px 0 16px;}

  /* set tabs / chips */
  .set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .set-tab{font-size:13px;font-weight:600;color:#8B7DA6;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;transition:all .15s;}
  .set-tab.active{background:var(--soft);border-color:var(--deep);color:var(--deepest);font-weight:700;}
  .set-tab.done::after{content:"✓";margin-left:5px;color:var(--ok-ink);font-weight:800;}
  .prob-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px dashed var(--line);}
  .nav-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:#8B7DA6;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
  .nav-chip.active{background:var(--deep);border-color:var(--deep);color:#fff;}
  .nav-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .nav-chip.solved .dot{background:var(--ok-ink);}
  .nav-chip.opened .dot{background:var(--gold);}
  .nav-chip.active .dot{background:#EAD9F5;}
  .nav-num{font-family:'Pretendard',sans-serif;font-weight:700;font-size:15px;}
  .kkam-btn{margin-left:auto;border:1.5px solid var(--gold);background:#FFFDF6;color:#8a6a2e;border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR';}
  .kkam-btn:disabled{opacity:.45;cursor:default;}
  .kkam-btn.ready{background:var(--gold);color:#fff;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,149,90,.4);}50%{box-shadow:0 0 0 6px rgba(196,149,90,0);}}

  /* ===== 문항: 한글(hwpx) 지면 재현 ===== */
  .qitem{border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px;background:#fff;margin-bottom:16px;}
  .qitem, .qitem *{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;}
  .qtitle{font-size:18.5px;line-height:1.6;color:var(--pen);text-align:justify;margin-bottom:12px;}
  .qtitle .qn{font-weight:800;margin-right:4px;}
  .qtitle b{font-weight:700;}
  .qtitle u{text-decoration-thickness:1.5px;text-underline-offset:3px;}
  .qsrc{font-weight:500;color:#6F6683;font-size:16px;margin-left:4px;white-space:nowrap;}
  .multi-badge{display:inline-block;vertical-align:2px;margin-left:6px;background:var(--gold);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;}
  .passage{font-size:19px;line-height:1.85;font-weight:500;color:var(--pen);text-align:justify;word-break:keep-all;overflow-wrap:break-word;hyphens:none;}
  .passage p{text-indent:.3em;margin:0;}
  .passage p+p{margin-top:.2em;}
  .passage u{text-decoration:underline;text-decoration-thickness:1.3px;text-underline-offset:4px;text-decoration-skip-ink:none;}
  .mk{font-weight:600;margin-right:2px;font-size:1.12em;line-height:1;}
  .opt{cursor:pointer;border-radius:5px;padding:1px 2px;transition:background .12s, box-shadow .12s;-webkit-user-select:none;user-select:none;}
  .opt.sel{background:#E9DAF7;box-shadow:0 0 0 1.5px var(--deep) inset;}
  .opt.sel .mk{color:var(--deep);}
  .opt.elim{color:#A99FB8;}
  .opt.elim u{text-decoration-color:#C9BFD6;}
  .opt.ok{background:#DCEFDC;box-shadow:0 0 0 1.5px var(--ok-ink) inset;}
  .opt.bad{background:#F6DEDE;box-shadow:0 0 0 1.5px #C99 inset;}
  .lock .opt{cursor:default;}
  .br{white-space:nowrap;}
  .br .brl{font-weight:700;}
  .br i{font-style:normal;color:#555;}
  .fn{font-size:16px;color:#333;margin-top:10px;text-align:right;}
  .bogi{border:1.3px solid #444;border-radius:2px;padding:16px 16px 12px;margin:18px 0 6px;position:relative;}
  .bogi-t{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:16px;font-weight:700;color:var(--pen);}
  .bogi-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:17.5px;font-weight:500;color:var(--pen);}
  .clist{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:16px;}
  .ch{font-size:18px;font-weight:500;color:var(--pen);padding:6px 10px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;transition:all .12s;}
  .ch .cn{font-weight:600;margin-right:8px;font-size:1.15em;}
  .ctab{border-collapse:collapse;margin-top:16px;font-size:18px;font-weight:500;color:var(--pen);}
  .ctab th{font-weight:700;padding:4px 16px 6px;text-align:left;}
  .ctab td{padding:6px 16px;}
  .ctab td:first-child{padding-left:10px;font-weight:600;font-size:1.15em;}
  .ctab tr.ch{display:table-row;}
  .ctab tr.ch td{border-top:1.5px solid transparent;border-bottom:1.5px solid transparent;}
  .ctab tr.ch td:first-child{border-left:1.5px solid transparent;border-radius:8px 0 0 8px;}
  .ctab tr.ch td:last-child{border-right:1.5px solid transparent;border-radius:0 8px 8px 0;}
  .ch.sel, .ctab tr.ch.sel td{background:#E9DAF7;border-color:var(--deep);}
  .ch.elim, .ctab tr.ch.elim td{color:#A99FB8;}
  .ch.ok, .ctab tr.ch.ok td{background:#DCEFDC;border-color:var(--ok-ink);}
  .ch.bad, .ctab tr.ch.bad td{background:#F6DEDE;border-color:#C99;}
  .lock .ch{cursor:default;}

  /* answer zone */
  .notezone{position:relative;margin-top:18px;border:1.5px solid var(--line);border-radius:14px;background:radial-gradient(var(--line) 1px, transparent 1px);background-size:17px 17px;background-color:#FCFAFE;padding:16px 16px 14px;}
  .note-label{display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--deep);background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin-bottom:12px;}
  .note-label span{font-family:'Noto Sans KR';font-weight:700;font-size:11px;letter-spacing:0;color:#9485AE;}
  .omr{display:flex;gap:12px;flex-wrap:wrap;}
  .omr button{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--deepest);font-size:27px;line-height:1;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .12s;}
  .omr button:active{transform:scale(.94);}
  .omr button.sel{background:var(--deep);border-color:var(--deep);color:#fff;}
  .omr button.elim{opacity:.35;text-decoration:line-through;cursor:default;}
  .omr button.ok{background:var(--ok-ink);border-color:var(--ok-ink);color:#fff;}
  .omr button.bad{background:#C99;border-color:#C99;color:#fff;}
  .builder-hint{font-size:13px;color:#7A6E92;margin-top:10px;}
  .builder-hint b{color:var(--deep);}
  .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  button.submit{background:var(--deep);color:#fff;border:none;border-radius:10px;padding:13px 30px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.submit:disabled{background:#C9BED6;}
  .try-count{font-size:13px;color:#7A6E92;}
  .try-count b{color:var(--deep);font-size:15px;}
  .note-coffee{position:absolute;bottom:8px;right:12px;width:50px;opacity:.9;pointer-events:none;}

  .log-title{font-size:11.5px;font-weight:700;color:#9485AE;letter-spacing:.05em;margin:20px 0 9px;}
  .attempt{border:1px solid var(--line);border-radius:11px;padding:10px 15px;margin-bottom:8px;background:#fff;display:flex;align-items:center;gap:10px;font-size:14px;animation:pop .28s ease;}
  .attempt.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-ink);}
  .attempt.correct{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink);}
  .try-badge{background:var(--mid);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;}
  .attempt.wrong .try-badge{background:#C99;}
  .attempt.correct .try-badge{background:var(--ok-ink);}
  .attempt .pick{font-family:'Pretendard';font-size:18px;font-weight:600;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}

  .reaction{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:64px;}
  .reaction img{width:66px;height:auto;filter:drop-shadow(0 3px 5px rgba(77,45,122,.16));animation:bob .5s ease;}
  @keyframes bob{from{transform:translateY(8px) scale(.9);opacity:0;}to{transform:none;opacity:1;}}
  .bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px;color:var(--ink);font-weight:500;max-width:560px;}
  .bubble::before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);}
  .bubble b{color:var(--deep);}

  /* reveal */
  .reveal{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .35s ease;}
  .reveal-head{background:var(--deepest);color:#fff;padding:11px 18px;font-size:13.5px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:10px;}
  .reveal-head img{width:40px;height:auto;}
  .reveal-body{padding:18px 20px;background:#fff;font-family:'Pretendard',sans-serif;}
  .ans-big{display:inline-flex;align-items:center;gap:10px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:10px;padding:8px 16px;font-size:16px;font-weight:700;color:#2f4a33;margin-bottom:6px;}
  .ans-big span{font-size:24px;font-weight:700;}
  .sol-label{font-size:12px;font-weight:700;color:var(--deep);letter-spacing:.04em;margin:16px 0 8px;font-family:'Noto Sans KR';}
  .cb{background:#FBF8FE;border:1px solid var(--line);border-left:4px solid var(--deep);border-radius:10px;padding:14px 18px 15px;margin:14px 0 12px;}
  .cb-tag{display:inline-block;font-size:16px;font-weight:800;color:var(--deep);margin-bottom:4px;}
  .cb-fix{font-size:18.5px;font-weight:700;color:var(--deepest);line-height:1.6;margin-bottom:8px;}
  .cb-body .ln{font-size:17px;line-height:1.75;color:var(--pen);margin-bottom:5px;}
  .cb-body .ln b{color:var(--deepest);}
  .cb-body .ln.en{font-size:17.5px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 0 8px;text-indent:0;}
  .ln.en .par{color:#9A90AA;}
  .ln.en .tgt{color:var(--deep);font-weight:700;}
  .cb-ko{font-size:16px;color:#5f566f;margin-top:6px;}
  .sum-line{font-size:17px;font-weight:700;color:var(--deepest);margin:4px 0 6px 4px;}
  .notebox{background:linear-gradient(180deg,#FFFDF6,#FDF7EA);border:1px solid #E9D8B4;border-left:4px solid var(--gold);border-radius:10px;padding:11px 15px;margin-top:6px;font-size:16.5px;line-height:1.7;}
  .notebox > b:first-child{color:#8a6a2e;}
  .sol-sub p{font-size:16.5px;line-height:1.7;color:#3a3348;margin:0 0 7px;}
  .sol-sub .ow{margin-right:8px;color:var(--pen);}
  .tab-sub{font-size:11px;font-weight:500;color:#A99FB8;margin-left:3px;}
  .set-tab.active .tab-sub{color:var(--deep);}
  .nav-chip.answered .dot{background:var(--deep);}
  .nav-chip.answered{border-color:var(--mid);color:var(--deep);}
  .nav-chip.wrongc .dot{background:#C55;}
  .nav-chip.wrongc{border-color:#E7C9C9;color:var(--wrong-ink);}
  .nav-chip.solved{border-color:var(--ok-border);color:var(--ok-ink);}
  .nav-chip.active{color:#fff;}
  .act-box{margin-left:auto;display:flex;gap:6px;}
  .score-btn{border:1.5px solid var(--deep);background:#fff;color:var(--deep);border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR';}
  .score-btn.on{background:var(--soft);}
  .act-box .kkam-btn{margin-left:0;}
  button.nextbtn:disabled{opacity:.4;cursor:default;}
  .grade-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  button.grade{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.grade:disabled{background:#E3D7C4;cursor:default;}
  .grade-hint{font-size:12.5px;color:#7A6E92;padding-right:56px;}
  .myres{display:flex;justify-content:space-between;align-items:center;border-radius:11px;padding:11px 16px;margin-top:14px;font-size:15px;}
  .myres b{font-family:'Pretendard';font-size:19px;}
  .myres.ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok-ink);}
  .myres.bad{background:var(--wrong-bg);border:1px solid var(--wrong-border);color:var(--wrong-ink);}
  .myres .v{font-weight:800;}
  .score-card{border:1.5px solid var(--line);border-radius:16px;padding:20px;background:linear-gradient(180deg,#fff,#FBF7FE);}
  .score-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .score-top img{width:78px;}
  .score-t{font-size:14px;font-weight:700;color:var(--deep);}
  .score-n{font-family:'Pretendard';font-size:20px;color:#7A6E92;}
  .score-n b{font-size:42px;color:var(--deepest);}
  .score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
  .sg{border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;border:1.5px solid;display:flex;flex-direction:column;gap:1px;}
  .sg.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink);}
  .sg.bad{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-ink);}
  .sgn{font-family:'Pretendard';font-weight:700;font-size:15px;}
  .sgv{font-size:22px;font-weight:800;line-height:1.1;}
  .sga{font-size:11px;font-family:'Pretendard';}
  .score-msg{margin:0 auto 14px;max-width:none;}
  .score-msg::before{display:none;}
  .note-guide{margin-top:16px;border:1.5px solid #E9D8B4;border-left:5px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#FFFDF6,#FDF7EA);padding:18px 20px;}
  .ng-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .ng-t{font-size:18px;font-weight:800;color:#8a6a2e;}
  .ng-nos{font-size:15px;color:var(--ink);}
  .ng-nos b{color:var(--wrong-ink);}
  .ng-sub{font-size:15.5px;color:var(--ink);margin-bottom:10px;}
  .ng-steps{margin:0 0 12px 22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.65;color:var(--ink);}
  .ng-steps b{color:var(--deepest);}
  .ng-eg{display:block;font-size:14px;color:#7A6E92;font-family:'Pretendard',sans-serif;}
  .ng-warn{color:var(--wrong-ink);font-weight:700;white-space:nowrap;}
  .ng-why{display:block;font-size:13.5px;color:#7A6E92;margin-top:4px;}
  .ng-btn{background:#fff;border:1.5px solid #E0C994;color:#8a6a2e;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .ng-img{display:block;max-width:100%;width:520px;margin-top:12px;border-radius:10px;border:1px solid var(--line);}
  .t-box{background:#FBF8FE;border:1px solid var(--line);border-left:4px solid var(--deep);border-radius:10px;padding:14px 18px;margin:14px 0 12px;display:flex;flex-direction:column;gap:7px;}
  .t-tag{font-size:17px;font-weight:800;color:var(--deep);margin-top:6px;line-height:1.6;}
  .t-tag:first-child{margin-top:0;}
  .t-tag .lab{margin-right:6px;}
  .t-tag-rest{display:block;font-weight:600;color:var(--pen);font-size:17px;}
  .t-ln{font-size:17px;line-height:1.75;color:var(--pen);}
  .t-memo{font-size:16px;line-height:1.7;color:#6a4f1f;}
  .arr{color:var(--deep);}
  .t-star{background:linear-gradient(180deg,#FFFDF6,#FDF7EA);border:1px solid #E9D8B4;border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;}
  .t-star .t-ln{font-size:16px;}
  .t-tblw{overflow-x:auto;}
  .t-tbl{border-collapse:collapse;font-size:15.5px;color:var(--pen);min-width:100%;}
  .t-tbl th,.t-tbl td{border:1px solid var(--line);padding:5px 10px;text-align:left;}
  .t-tbl th{background:var(--soft);color:var(--deepest);}
  .ans-x{font-style:normal;font-size:15px;font-weight:600;margin-left:6px;color:#2f4a33;}
  .t-ko{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;}
  .t-ko summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--deep);font-family:'Noto Sans KR';}
  .t-ko p{font-size:16px;line-height:1.8;color:var(--pen);margin-top:8px;}
  .t-words{font-size:14.5px;color:#7A6E92;margin-top:10px;line-height:1.7;}
  .lab{display:inline-block;min-width:26px;text-align:center;background:var(--soft);border:1px solid var(--line);color:var(--deepest);font-size:14px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:7px;}
  .next-row{display:flex;justify-content:flex-end;margin-top:16px;}
  button.nextbtn{background:#fff;color:var(--deep);border:1.5px solid var(--line);border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}

  .pfoot{display:flex;justify-content:space-between;font-size:10px;color:#9485AE;border-top:1px solid var(--line);padding-top:9px;margin-top:20px;}
  .pfoot .serif{letter-spacing:2px;color:var(--deep);}
  .foot-note{margin-top:16px;font-size:11.5px;color:#9485AE;text-align:center;line-height:1.7;}
  .reset-link{color:var(--deep);font-weight:700;text-decoration:underline;cursor:pointer;}
  .resume-toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-24px);opacity:0;transition:all .35s ease;z-index:80;background:var(--deepest);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 6px 20px rgba(77,45,122,.35);white-space:nowrap;}
  .resume-toast.show{opacity:1;transform:translate(-50%,0);}
  .resume-toast b{color:#EAD9F5;}

  /* 깜지 */
  .kkam-head .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:2px;color:var(--deepest);}
  .kkam-sub{font-size:13px;color:#7A6E92;margin:4px 0 14px;}
  .kkam-name{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .kkam-name label{font-size:12.5px;font-weight:700;color:var(--deep);}
  .kkam-name input{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-family:'Noto Sans KR';color:var(--ink);}
  .kkam-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:#fff;}
  .kkam-ref{font-family:'Pretendard',sans-serif;}
  .kkam-instr{font-size:12.5px;color:#9485AE;margin:9px 0 8px;}
  .kkam-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .kkam-toolbar button{border:1.5px solid var(--line);background:#fff;color:var(--deep);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .kkam-toolbar button.on{background:var(--deep);color:#fff;border-color:var(--deep);}
  .kkam-toolbar .sp{margin-left:auto;font-size:11.5px;color:#9485AE;}
  .canvas-box{position:relative;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;touch-action:none;}
  .canvas-box canvas{display:block;width:100%;touch-action:none;}
  .kkam-done{display:flex;gap:12px;justify-content:center;margin-top:8px;}
  button.big{background:var(--deep);color:#fff;border:none;border-radius:12px;padding:14px 30px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.big.ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line);}
  .comp-card{border:2px solid var(--deep);border-radius:16px;padding:22px;background:linear-gradient(180deg,#fff,#FBF7FE);text-align:center;}
  .comp-stamp{display:inline-block;transform:rotate(-8deg);border:3px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;letter-spacing:2px;padding:6px 18px;border-radius:10px;margin-bottom:14px;}
  .comp-line{font-size:14px;color:var(--ink);margin:4px 0;}
  .comp-line b{color:var(--deepest);}
  .comp-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .comp-thumbs img{width:120px;border:1px solid var(--line);border-radius:8px;}
  .comp-shot{font-size:12.5px;color:var(--deep);font-weight:700;background:var(--soft);border:1px dashed var(--mid);border-radius:10px;padding:10px;margin-top:12px;}
  .comp-mascot{width:70px;margin:0 auto 6px;display:block;}

  @media (max-width:600px){
    .score-grid{grid-template-columns:repeat(3,1fr);}

    .sheet{padding:18px 14px;} .qitem{padding:16px 14px;}
    .passage{font-size:17px;} .qtitle{font-size:17px;}
    .clist,.bogi-grid{grid-template-columns:1fr;}
    .omr button{width:50px;height:50px;font-size:23px;}
  }
</style>
</head>

const PROBLEMS = [{"no": 1, "src": "교재 고1 #1", "stem": "<b>(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["Every place on the earth is different. Just like people, no two places can be <span class=\"br\"><span class=\"brl\">(A)<\/span>[exact <i>/<\/i> exactly]<\/span> alike. However, some places are similar in certain ways. There are patterns in the way people live and use the land. The design of buildings shows one pattern. Many large cities have very tall buildings <span class=\"br\"><span class=\"brl\">(B)<\/span>[called <i>/<\/i> calling]<\/span> skyscrapers. There is not enough land, so people make more room by building up into the sky. Other patterns can be found in the foods we eat, the way we dress, or the way we grow crops. Learning about these patterns <span class=\"br\"><span class=\"brl\">(C)<\/span>[help <i>/<\/i> helps]<\/span> us to understand the world a little better."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["exact", "called", "help"], ["exact", "calling", "helps"], ["exactly", "called", "helps"], ["exactly", "calling", "help"], ["exactly", "called", "help"]]}, "ans": [3], "ans_extra": "", "exp": [{"t": "txt", "v": "(A) [형용사 vs 부사]"}, {"t": "txt", "v": "2형식 동사 be동사 + 보어(형용사).  문장성분에 영향을 주지 못하는 부사만이 둘 사이에 위치할 수 있다."}, {"t": "txt", "v": "(B) [현재분사 vs 과거분사]"}, {"t": "txt", "v": "skyscrapers라고 '불리는' 빌딩. 이므로 수동의 의미를 갖는 p.p."}, {"t": "txt", "v": "(C) [동명사주어 수일치]"}, {"t": "txt", "v": "Learning (about these patterns) helps"}, {"t": "txt", "v": "→ 동명사 주어는 항상 단수 취급한다."}, {"t": "txt", "v": "★★★★★★★★★★★★★★★★★★★★★★★★★"}, {"t": "txt", "v": "※ 수일치에서 불필요한 수식어를 괄호를 통해 지워나가는 연습을 반드시 할 것."}, {"t": "txt", "v": "① (쉼표[,]쉼표[,]삽입)"}, {"t": "txt", "v": "② (관계대명사)- 형용사절(which, that, who, whom등) / 명사절은 예외(what)"}, {"t": "txt", "v": "③ (to부정사의 부사적용법)"}, {"t": "txt", "v": "④ (전치사+명사)- 전명구"}, {"t": "txt", "v": "⑤ -ly 장소, 시간, 원인, 조건 등의 부사들(부사절포함)"}, {"t": "txt", "v": "★★★★★★★★★★★★★★★★★★★★★★★★★ : 8, "src": "교재 고1 #8", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Back in the 1800s, Henry David Thoreau wrote that the man who <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>desperately<\/u><\/span> keeps checking for letters from others “has not heard his inner voice in a long while.” The author William Powers argues that the same can be true these days for those who <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>are<\/u><\/span> continuously checking e-mail, Facebook, Twitter, etc. They keep wondering <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>if<\/u><\/span> there are any comments on their comments, and who has read their latest post. Powers praises the benefits of solitude, warns not to depend on others’ views, and <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>giving<\/u><\/span> lessons on how to maintain balance. He tells us that his own family follows an Internet Sabbath on weekends. They found it scary at first but now welcome it as a break from always      <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>being<\/u><\/span> connected.           *Sabbath 안식일"], "notes": [], "bogi": null, "ch": null, "ans": [4], "ans_extra": "", "exp": [{"t": "txt", "v": "[병렬구조]"}, {"t": "txt", "v": "Powers praises the benefits of solitude, warns not to depend on others’ views, and gives lessons on how to maintain balance."}], "ko": "1800년대에, Henry David Thoreau는, 다른 사람에게서 편지가 왔는지를 절박하게 계속 확인하는 사람은 오랜 기간 자신의 내면의 목소리는 듣지 못한다고 썼다. 작가 William Powers는 이런 현상이 끊임없이 이메일, Facebook, Twitter를 확인하는 요즘 사람들에게도 해당된다고 주장한다. 그들은 그들의 글에 댓글이 달렸는지, 자신의 최근 글을 누가 읽었는지를 늘 궁금해 한다. Powers는 홀로 있음의 좋은 점을 찬양하고 다른 사람들의 의견에 매달리지 말라고 경고하고, 균형을 유지하는 방법에 대한 교훈을 준다. 그는 그의 가족들이 주말마다 인터넷 안식일을 지킨다고 말한다. 그들은 처음에는 두려웠지만 이제는 늘 접속된 상태로부터의 휴식으로 이 날을 환영한다고 말한다.", "words": "⋅solitude 고독, 홀로 있음", "others": [["①", "desperately", "동사 keeps checking 수식 → 부사 desperately"], ["②", "are", "선행사 those(복수) → 관계절 동사 are"], ["③", "if", "wondering의 목적어, '~인지 아닌지' → 명사절 if"], ["⑤", "being", "전치사 from 뒤 → 동명사 being (connected)"]], "ex": {}}, {"no": 9, "src": "교재 고1 #9", "stem": "<b>(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["For thousands of years, people have looked up at the night sky and looked at the moon. They wondered <span class=\"br\"><span class=\"brl\">(A)<\/span>[if <i>/<\/i> what]<\/span> the moon was made of. They wanted to know how big it was and how far away it was. One of the most interesting questions was “Where did the moon come from?” No one knew for sure. Scientists developed <span class=\"br\"><span class=\"brl\">(B)<\/span>[many <i>/<\/i> much]<\/span> different theories, or guesses, but they could not prove that their ideas were correct. Then, between 1969 and 1972, the United States sent astronauts to the moon for their studying the moon and <span class=\"br\"><span class=\"brl\">(C)<\/span>[returned <i>/<\/i> returning]<\/span> to Earth with rock samples."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["if", "many", "returning"], ["if", "much", "returned"], ["what", "many", "returned"], ["what", "much", "returned"], ["what", "many", "returning"]]}, "ans": [5], "ans_extra": "", "exp": [{"t": "txt", "v": "(A) [명사절 if vs 명사절 what]"}, {"t": "txt", "v": "They wondered what the moon was made of."}, {"t": "txt", "v": "'전치사의 목적어'가 없는 형태의 불완전한 문장이 뒤따르므로 what이 정답"}, {"t": "txt", "v": "(B) [셀 수 있는 many vs 셀 수 없는 much]"}, {"t": "txt", "v": "different theories. → 셀 수 있으니 복수형으로 씀"}, {"t": "txt", "v": "(C) [동사 vs 준동사]"}, {"t": "txt", "v": "높은 오답률이 예상된다. 학생들의 시선에선 정답을 잡아내기 어려울 수도 있겠다는 생각이 든다."}, {"t": "txt", "v": "the United States sent astronauts to the moon for their studying the moon and returning to Earth with rock samples."}, {"t": "txt", "v": "『미국은 우주인들을 달에 보냈다, 그리고 돌아왔다』가 아니라, 『미국은 우주인들을 달에 보냈다 for 뭐하기 위해? 그들의 달에 관한 연구를 위해 그리고 암석 샘플을 지구로 가져오기 위해』, 전치사 for에 걸리는 동명사 병렬구조이다."}], "ko": "", "words": "⋅for sure 확실히 ⋅develop 발전시키다", "others": [], "ex": {}}, {"no": 10, "src": "교재 고1 #10", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["I was working at a nursing home. It was late in the evening <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>when<\/u><\/span> I finished, so I ran down the street to the bus stop. I enjoyed the ride home and watched my fellow passengers <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>got off<\/u><\/span> at their stops. After a while, I was the only one <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>left<\/u><\/span> on the bus. As the bus approached my stop, the driver called out to me, “Where do you live?” I explained to him <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>that<\/u><\/span> I lived just up the next street. He then offered to drop me off outside my house. I was very thanked the bus driver and walked to my door, <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>knowing<\/u><\/span> that I would never forget his kindness."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ans_extra": "", "exp": [{"t": "txt", "v": "[지각동사]"}, {"t": "txt", "v": "watch, see, look at, listen, hear, observe, notice 등은 목적격 보어로 동.원/현재분사/과거분사를 취할 수 있는데, 이 때 목적어와 목적보어의 관계가 능동이면 동.원이나 현재분사가 오고, 둘의 관계가 수동이면 과거분사가 온다. ‘내려지는’이 아니라 직접 ‘내리는’것 이므로 능동"}, {"t": "txt", "v": "watched my fellow passengers get off 혹은 getting off"}], "ko": "", "words": "⋅nursing home 양로원 ⋅approach 다가오다", "others": [["①", "when", "뒷문장 완전(I finished) → '~할 때' when"], ["③", "left", "the only one이 '남겨진' 수동 → 과거분사 left"], ["④", "that", "explained의 목적어, 뒷문장 완전 → 접속사 that"], ["⑤", "knowing", "I가 '아는' 능동 → 분사구문 knowing"]], "ex": {}}, {"no": 11, "src": "교재 고1 #11", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Grandma does not know which year she was born in. I know my father is fifty years old, so I estimate that she must be at least seventy. She is healthier <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>than<\/u><\/span> my father. In fact, she has never been in the hospital and criticizes my father for <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>being<\/u><\/span> weak and going to the hospital frequently. One of her pastimes <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>are<\/u><\/span> telling us a lot of stories from legends and, best of all, ghost stories. She has also told many stories, <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>which<\/u><\/span> she claims are her own adventures. She even claims that she was once    <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>kidnapped<\/u><\/span> by a devil and escaped three days later."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ans_extra": "", "exp": [{"t": "txt", "v": "[수일치]"}, {"t": "txt", "v": "One (of her pastimes)  is"}], "ko": "", "words": "⋅estimate 어림잡다, 추산하다 ⋅legend 전설 ⋅kidnap 납치하다", "others": [["①", "than", "비교급 healthier → than"], ["②", "being", "전치사 for 뒤 → 동명사 being (weak)"], ["④", "which", "삽입절 she claims 제외, 주어 빠진 불완전 → 관계대명사 which"], ["⑤", "kidnapped", "그녀가 '납치된' 수동 → was kidnapped"]], "ex": {}}, {"no": 12, "src": "교재 고1 #12", "stem": "<b>(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["In the early days of automobiles, tires were seldom black. The rubber from which they were made was naturally colored off ― white or tan. Today’s black tires owe <span class=\"br\"><span class=\"brl\">(A)<\/span>[its <i>/<\/i> their]<\/span> color to an accidental discovery. In 1885, a rubber tire company decided to try black tires, <span class=\"br\"><span class=\"brl\">(B)<\/span>[thinking <i>/<\/i> thought]<\/span> that they might not show dirt. They added carbon black coloring to the rubber mixture. To their surprise, they discovered <span class=\"br\"><span class=\"brl\">(C)<\/span>[that <i>/<\/i> what]<\/span> the carbon-colored rubber tires were five times more durable than the uncolored ones."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["its", "thought", "that"], ["its", "thinking", "what"], ["their", "thought", "that"], ["their", "thought", "what"], ["their", "thinking", "that"]]}, "ans": [5], "ans_extra": "", "exp": [{"t": "txt", "v": "(A) [its vs their 대명사 수일치]"}, {"t": "txt", "v": "오늘날의 검은색 타이어의 색깔은 어떤 우연한 발견 때문에 그렇게 된 것이다."}, {"t": "txt", "v": "'그것의'인지 '그것들의'인지 단수/복수를 파악하기 위해 문맥상 정확히 어떤 명사를 대신하는 대명사인지 파악해야 한다. '검은색 타이어들의 색깔' →their color"}, {"t": "txt", "v": "(B) [동사 vs 준동사] '동시동작' 분사구문"}, {"t": "txt", "v": "1885년에 고무타이어 회사는 결정했다 검은색 타이어를 시도해보기로, 그것들이 더럽게 보이지 않을 수 있다고 생각하면서"}, {"t": "txt", "v": "혹은, 동사가 오려면 접속사가 있어야 되는데 접속사가 없으므로 동사가 아닌 준동사(-ing)를 고를 수도 있다."}, {"t": "txt", "v": "(C) [명사절 접속사that vs 명사절 관계대명사what]"}, {"t": "txt", "v": "뒷문장이 완전하므로 that!"}, {"t": "txt", "v": "carbon-colored rubber tires(주어) were(동사) five times more durable(형용사보어)"}], "ko": "자동차 초기 시대에 타이어는 검은색이 거의 없었다. 타이어를 만드는 고무는 자연적으로 탈색이 되어 흰색이나 황갈색이었다. 오늘날의 검은색 타이어의 색깔은 어떤 우연한 발견 때문에 그렇게 된 것이다. 1885년에 한 고무 타이어 회사에서 검은색 타이어는 흙먼지를 드러나게 하지 않을 것이라고 생각하여 검은색 타이어를 만들어 보기로 했다. 그들은 고무 혼합물에 검은색 탄소 색소를 첨가했다. 놀랍게도 그들은 탄소 색소를 넣은 고무 타이어가 색깔을 넣지 않은 고무 타이어보다 다섯 배나 더 오래 간다는 사실을 발견했다.", "words": "⋅accidental 우연한 ⋅carbon 탄소 ⋅mixture 혼합물 ⋅durable 오래 견디는", "others": [], "ex": {}}, {"no": 13, "src": "교재 고1 #13", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["The city of Pompeii is a <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>partially<\/u><\/span> buried Roman town-city near modern Naples. Pompeii was destroyed and buried <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>during<\/u><\/span> a long eruption of the volcano Mount Vesuvius in 79 AD. The eruption buried Pompeii under 4 to 6 meters of ash and stone, and it <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>lost<\/u><\/span> for over 1,500 years before its accidental rediscovery in 1599. Since then, its rediscovery <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>has provided<\/u><\/span> a detailed insight into the life at the height of the Roman Empire. Today, this UNESCO World Heritage Site is one of Italy’s most popular tourist attractions, with about 2,500,000 people <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>visiting<\/u><\/span> every year."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ans_extra": "", "exp": [{"t": "txt", "v": "[능동 vs 수동]"}, {"t": "txt", "v": "The eruption buried Pompeii under 4 to 6 meters of ash and stone, and it ③lost for over 1,500 years before its accidental rediscovery in 1599."}, {"t": "txt", "v": "Pompeii(it)는 ‘잊혀졌다‘의 의미가 되어야 하므로 was lost가 맞다. 평가원 해설에는 was lost로 명시되어 있지만, 문맥상 had been lost도 가능하지 않을까?라는 생각에, 여러 영어강사와 토론을 해보았다. 대부분 ’기간을 나타내는 for 때문에 had been lost가 맞지 않냐?’라는 의견이었으나, buried가 먼저 일어난 일인데도 과거시제로 써있는데 had been lost 과거완료나 대과거가 오면 어색하다고 생각하기에 was lost가 더 적절한 것으로 결론지어 졌다."}], "ko": "", "words": "⋅eruption 분출 ⋅insight 통찰(력) ⋅at the height of 전성기의", "others": [["①", "partially", "분사 buried 수식 → 부사 partially"], ["②", "during", "뒤에 명사구(a long eruption) → 전치사 during"], ["④", "has provided", "Since then(그 이후로) + 주어 its rediscovery(단수) → has p.p."], ["⑤", "visiting", "with + 목적어 + 분사, people이 '방문하는' 능동 → visiting"]], "ex": {}}, {"no": 14, "src": "교재 고1 #14", "stem": "<b>(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["In living birds, feathers have many functions other than flight. They help to keep a bird <span class=\"br\"><span class=\"brl\">(A)<\/span>[warm <i>/<\/i>  warmly]<\/span> by trapping heat produced by the body close to the surface of the skin. Feathers may also be used to <span class=\"br\"><span class=\"brl\">(B)<\/span>[attract <i>/<\/i> attracting]<\/span> mates. The tail of Caudipteryx carried a large fan of long feathers, a structure that would have made a very impressive display. The rest of the body seems to have been covered in much shorter feathers, <span class=\"br\"><span class=\"brl\">(C)<\/span>[which <i>/<\/i> that]<\/span> would have kept out the cold. A few large feathers were present on the arms, and these might have been involved in display."], "notes": ["*Caudipteryx 깃털공룡"], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["warm", "attract", "which"], ["warm", "attracting", "which"], ["warm", "attracting", "that"], ["warmly", "attract", "that"], ["warmly", "attracting", "which"]]}, "ans": [1], "ans_extra": "", "exp": [{"t": "txt", "v": "(A) [형용사 vs 부사]"}, {"t": "txt", "v": "keep O O.C  보어로 부사는 올 수 없다."}, {"t": "txt", "v": "(B) [be used to부정사 vs be used to 명사/-ing]"}, {"t": "txt", "v": "be used toR ~하기 위해 사용되다"}, {"t": "txt", "v": "be used to 명사/-ing ~하는데에 익숙하다"}, {"t": "txt", "v": "(C) [관계대명사 계속적용법]"}, {"t": "txt", "v": "which가 정답"}, {"t": "txt", "v": "관계대명사 that은 계속적용법으로 쓸 수 없다."}], "ko": "", "words": "⋅feather 깃털 ⋅trap 가두다 ⋅display (새,동물이)구애하다. 진열, 과시", "others": [], "ex": {}}, {"no": 15, "src": "교재 고1 #15", "stem": "<b>(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["I remember <span class=\"br\"><span class=\"brl\">(A)<\/span>[to run <i>/<\/i> running]<\/span> a workshop last year for a group of senior academics on how they might improve collaboration. We were discussing behavior that should exist <span class=\"br\"><span class=\"brl\">(B)<\/span>[that <i>/<\/i> what]<\/span> has been shown to improve productivity: whenever anyone has a concern, he or she explains the concern in a frank and respectful way. As I was explaining this idea, I could see a woman rolling her eyes at my comments and clearly <span class=\"br\"><span class=\"brl\">(C)<\/span>[showed <i>/<\/i> showing]<\/span> disagreement with my words, so I said, “I think you are uncomfortable with this idea. Would you share your view with the group?” Without hesitation she said, “There is no way to tell a supervisor about a concern in a completely frank and open way. I did that once and I had to leave the department.”"], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["to run", "that", "showed"], ["to run", "what", "showing"], ["running", "what", "showing"], ["running", "what", "showed"], ["running", "that", "showing"]]}, "ans": [5], "ans_extra": "", "exp": [{"t": "txt", "v": "(A) [동명사 vs to부정사]"}, {"t": "txt", "v": "remember -ing ~했던 것을 기억하다"}, {"t": "txt", "v": "remember toR ~할 것을 기억하다"}, {"t": "txt", "v": "(B) [형용사절 관계대명사that vs 명사절 관계대명사 what]"}, {"t": "txt", "v": "이중관계대명사절"}, {"t": "txt", "v": "We(주어) + were discussing(동사) + behavior(목적어) that should exist(수식1) + that has been shown to improve productivity(수식2)"}, {"t": "txt", "v": "that should exist를 괄호처리하면 what앞에 명사 못오니까 that이 정답"}, {"t": "txt", "v": "(C) [지각동사] + [병렬구조]"}, {"t": "txt", "v": "지각동사 see 목적어 목적격보어"}, {"t": "txt", "v": "현재분사 –ing 병렬구조"}], "ko": "작년에 나는 나이든 교수들을 대상으로 그들이 어떻게 협동심을 향상시킬 수 있는지에 관한 워크숍을 운영했던 것을 기억한다. 우리는 생산성을 향상시켰다고 입증되어 왔고, 또한 존재해야만 하는 행동에 대해 토론을 하고 있는 중이었다. 누구든 관심사가 있을 때마다, 솔직하고 공손한 방식으로 그 관심사를 설명한다. 내가 이러한 생각을 설명하고 있을 때, 나는 한 여성분이 내 의견에 눈을 굴리며 나의 말에 동의하지 않는다는 것을 보았다. 그래서 나는 말했다. “제가 보기엔 당신이 이 생각을 좋아하지 않는 거 같은데요. 이 그룹에서 당신의 견해를 말씀해 주시겠어요?” 전혀 주저하지 않고 그녀가 말했다. “완전히 솔직하고 개방된 방식으로 상사에게 말할 수 있는 방법은 없어요. 내가 일전에 그렇게 해봤는데요, 저는 그 부서를 떠나야 했어요.”", "words": "⋅collaboration 협력", "others": [], "ex": {}}, {"no": 16, "src": "교재 고1 #16", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["The ancient Egyptians developed a way of preserving the bodies of their dead, in the belief    <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>that<\/u><\/span> the body would be necessary in the ancient Egyptian afterlife and this would ensure their eternal survival. The liver, lungs, and brain        <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>removed<\/u><\/span>. The heart, however, was left in the body so that it could be judged on the Day of Judgement. The body was then covered with a salt-like substance to stop it from <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>decaying<\/u><\/span>. After that the body was packed with dry material such as linen or straw and <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>wrapped<\/u><\/span> in bandages. The process and techniques differed according to the roles and the wealth of the dead. The <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>wealthier<\/u><\/span> the dead, the more elaborate the process."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ans_extra": "", "exp": [{"t": "txt", "v": "[수동 vs 능동]"}, {"t": "txt", "v": "간, 폐, 그리고 뇌는 제거 되는 것이므로 수동의 be p.p.형으로 써야함."}, {"t": "txt", "v": "또한, remove는 ‘~을 제거하다‘라는 타동사이므로 뒤에 목적어(명사)가 있어야 한다. 그런데 없으므로 수동형인 be p.p."}], "ko": "", "words": "⋅decay 부패하다 ⋅elaborate 정교한", "others": [["①", "that", "the belief 뒤, 뒷문장 완전 → 동격의 접속사 that"], ["③", "decaying", "stop A from -ing, 전치사 뒤 → 동명사 decaying"], ["④", "wrapped", "was packed and (was) wrapped 병렬, 수동 → wrapped"], ["⑤", "wealthier", "the 비교급, the 비교급 구문 → the wealthier"]], "ex": {}}, {"no": 17, "src": "교재 고1 #17", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Dogs can tell <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>what<\/u><\/span> you like them or not. If you like them, they like you back. In fact, they love you and will do anything that they can <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>to please<\/u><\/span> you. People react the same way. If you do not like someone, chances are that they do not like you   <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>either<\/u><\/span>. Sometimes we make impulse judgments and dislike people without giving them a chance. What is in our hearts always shows. Keep your heart <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>open<\/u><\/span> to accept the best in everyone. Most people want to be good, fair, and liked. Love others, and you will <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>be loved<\/u><\/span> back."], "notes": [], "bogi": null, "ch": null, "ans": [1], "ans_extra": "", "exp": [{"t": "txt", "v": "[접속사 vs 관계대명사]"}, {"t": "txt", "v": "Dogs can tell what you like them or not."}, {"t": "txt", "v": "you(주어) + like(동사) + them(목적어)"}, {"t": "txt", "v": "뒷문장이 완전하므로 what이 올 수 없다."}, {"t": "txt", "v": "‘~인지 아닌지’의 whether이나 if가 와야 한다."}, {"t": "txt", "v": "or not을 보고서도 whether/if라는 힌트를 얻을 수 있다."}], "ko": "", "words": "⋅impulse 충동", "others": [["②", "to please", "'~을 기쁘게 하기 위해' 목적 → to부정사"], ["③", "either", "부정문에서 '~도 역시' → either"], ["④", "open", "keep + 목적어 + 형용사 목적격보어 → open"], ["⑤", "be loved", "you가 '사랑받는' 수동 → will be loved"]], "ex": {}}, {"no": 18, "src": "교재 고1 #18", "stem": "<b>(A)~(C)에서 어법에 맞는 표현을 바르게 짝지은 것은? ★<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["The Inchcape Rock is a great rock in the North Sea. Most of the time it is covered with water. That causes many boats and ships <span class=\"br\"><span class=\"brl\">(A)<\/span>[crash <i>/<\/i> to crash]<\/span> onto the rock. The rock is so close to the top of the water that all the vessels that try to sail over it <span class=\"br\"><span class=\"brl\">(B)<\/span>[hit <i>/<\/i> hits]<\/span> it. More than a hundred years ago, a kind-hearted man lived nearby. He thought that it was tragic for so many sailors to die on that hidden rock. So he fastened a floating mark to the rock with a strong chain, on top of <span class=\"br\"><span class=\"brl\">(C)<\/span>[it <i>/<\/i> which]<\/span> a bell was attached. When ships came near, the waves made the mark float back and forth and the bell ring clearly. Now, sailors were no longer afraid to cross the sea there."], " he marriage of two young lovers on the island    <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>was<\/u><\/span> opposed by both sets of parents. The parents found the couple together on a beach one day, and <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>to prevent<\/u><\/span> them from being together, one of the families moved to the mountains, separating the young couple forever. As a result, the naupaka flower was separated into two halves; one half moved to the mountains, and the other half <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>staying<\/u><\/span> near the beach. This story is a good example of a legend <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>which<\/u><\/span> native people invented to make sense of the world around them."], "notes": [], "bogi": null, "ch": null, "ans": [4], "ans_extra": "", "exp": [{"t": "txt", "v": "[동사 vs 준동사]"}, {"t": "txt", "v": "one half moved to the mountains, and the other half staying near the beach."}, {"t": "txt", "v": "문장과 문장이 and로 인해 연결되어 있다."}, {"t": "txt", "v": "그러므로 동사 2개여야 한다. staying→stayed"}], "ko": "", "words": "⋅oppose 반대하다", "others": [["①", "how", "explains의 목적어, 뒷문장 완전 → how(방법)"], ["②", "was", "주어 the marriage(단수) + '반대된' 수동 → was opposed"], ["③", "to prevent", "'~을 막기 위해' 목적 → to부정사"], ["⑤", "which", "invented의 목적어 빠진 불완전 → 관계대명사 which"]], "ex": {}}, {"no": 23, "src": "교재 고1 #23", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["A social enterprise is an organization that applies commercial strategies to maximize improvements in human and <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>environmental<\/u><\/span> well-being. Social enterprises can be <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>structured<\/u><\/span> as for-profit or non-profit. Many commercial enterprises would consider themselves to have social objectives, but commitment to these objectives is motivated by the perception <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>which<\/u><\/span> such commitment will ultimately make the enterprises more financially valuable. Social enterprises differ in that inversely, they do not aim to offer any benefit to their investors, except where they believe that doing so will further their capacity <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>to realize<\/u><\/span> their social goals. In the U.S., the term, ‘social enterprise’, is generally associated with ‘doing charity by doing trade.’ In other countries there is a  <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>much<\/u><\/span> stronger emphasis on community organizing and democratic control of capital rather than charity."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ans_extra": "", "exp": [{"t": "txt", "v": "[동격의 접속사 that]"}, {"t": "txt", "v": "(애들 어렵겠군 ㅋㅋ)"}, {"t": "txt", "v": "동격의 접속사 that이 정답!"}, {"t": "txt", "v": "일단, 뒷문장이 완전such commitment(주어) will ultimately make(동사) the enterprises(목적어) more financially valuable(목적격보어) 한걸로 보아"}, {"t": "txt", "v": "which는 안되고, where이나 in which, 접속사 that정도를 떠올려야 한다."}, {"t": "txt", "v": "『그러한 헌신이 궁극적으로 기업을 더 재정적으로 가치 있게 만든다는 생각』"}, {"t": "txt", "v": "《~라는 생각/~라는 개념/~라는 사실"}, {"t": "txt", "v": "the concept that / the idea that / the fact that"}, {"t": "txt", "v": "여기선 the perception that》"}, {"t": "txt", "v": "해석상 동격의 접속사 that이 와야 한다."}, {"t": "txt", "v": "뭐 사실 동격의 접속사 that인지까지는 몰랐더라도 뒷문장이 완전한건 쉽게 알 수 있었을테니 which가 안된다는 것에만 집중했다면 정답을 맞추기 어려웠던 문제는 아닌듯."}], "ko": "", "words": "⋅strategy 전략 ⋅commitment 헌신", "others": [["①", "environmental", "human and environmental 병렬, 명사 수식 → 형용사"], ["②", "structured", "기업이 '구성되는' 수동 → be structured"], ["④", "to realize", "명사 capacity 수식 → 형용사적 to부정사"], ["⑤", "much", "비교급 stronger 강조 → much"]], "ex": {}}, {"no": 24, "src": "교재 고1 #24", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "  ready 등..』"}, {"t": "txt", "v": "ex) Love keeps me alive."}, {"t": "txt", "v": "ex) I like the girl who smiles beautifully just like you."}, {"t": "txt", "v": "문제는 이렇게 출제될 수 있다."}, {"t": "txt", "v": "I like the girl who smiles beautifully just [alike / like] you."}], "ko": "", "words": "⋅mess 엉망, 혼돈 ⋅straighten up 정돈하다 ⋅opportunity 기회 ⋅subject 문제, 주제 ⋅lecture 잔소리하다, 강의하다", "others": [], "ex": {}}, {"no": 27, "src": "교재 고1 #27", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Grateful people are inclined to make healthy decisions. Life and sports present many situations  <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>where<\/u><\/span> critical and difficult decisions have to be made. Selfish adults or kids do not make sound decisions as well as <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>are<\/u><\/span> grateful people. This includes the decision to be self-motivated. Frustrated parents ask: “How do I motivate my child to do sports or continue in sports? Sometimes my child gets <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>discouraged<\/u><\/span> and does not want to put the required effort into his or her sports? What can I, as a parent, do or say to help?” It is difficult and almost impossible <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>to motivate<\/u><\/span> kids or adults who are centered on their own narrow selfish desires. However, kids and adults who live as grateful people are able to motivate <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>themselves<\/u><\/span>. They also welcome suggestions from others, even parents."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ans_extra": "", "exp": [{"t": "txt", "v": "[대동사] ★★★★"}, {"t": "txt", "v": "영어는 정말 반복을 싫어합니다."}, {"t": "txt", "v": "명사의 반복을 피하기 위해 대명사를 사용하듯이, 동사의 반복을 피하기 위해 대동사를 사용합니다."}, {"t": "txt", "v": "예를 들어, 앞 문장에서 동사 A가 나왔으면, 뒤에서 또 그 동사 A를 말해야 하는 경우,"} ><u>realizing<\/u><\/span> right away how useful the device could be to armies and sailors. As he made better and better spyglasses, which were later named telescopes, Galileo decided <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>to point<\/u><\/span> one at the Moon.            * weathervane: 풍향계"], "notes": [], "bogi": null, "ch": null, "ans": [4], "ans_extra": "realizing을 realized로", "exp": [{"t": "txt", "v": "[동사 vs 준동사]"}, {"t": "txt", "v": "Galileo, (who heard about the Dutch spyglass and began making his own,) ④realizing right away how useful the device could be to armies and sailors."}, {"t": "txt", "v": "쉼표(,) 쉼표(,) 삽입을 묶어 버린다. Galileo(주어), 어떤 갈릴레오? 네덜란드의 소형 망원경에 대해 듣고 자기만의 소형 망원경을 만들기 시작했던, 는 realized(동사) (right away) how useful the device could be(의주동 명사절 목적어) (to armies and sailors.)"}, {"t": "txt", "v": "부사와 전치사 명사는 묶어서 없는 셈 치자."}], "ko": "", "words": "⋅spyglass 소형 망원경", "others": [["①", "creating", "전치사 for 뒤 putting과 and 병렬 → 동명사"], ["②", "that", "뒷문장(the double lenses made ~)이 완전 → 접속사 that"], ["③", "much", "비교급 more 강조 → much"], ["⑤", "to point", "decide to-v → to부정사 목적어"]], "ex": {}}, {"no": 37, "src": "교재 고1 #37", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Foraging is a means of searching for wild food resources. This is a method <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>that<\/u><\/span> has been used for a long time and is possibly the longest method of food searching, tracing back to thousands of years ago. In the past, people commonly foraged for food in forests, riversides, caves, and virtually any place where food could possibly <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>be found<\/u><\/span>. Most of the foods foraged before <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>were<\/u><\/span> root crops, weeds, shrubs, and many more. Now, foraging has become a rising trend. People in today’s fast-paced society <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>engaging<\/u><\/span> in this either for necessity or for entertainment. Whatever purpose it may be, people are now slowly but surely getting acquainted with foraging. More and more people find it quite a fulfilling task and very <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>beneficial<\/u><\/span>.             * forage: 식량을 찾아다니다"], "notes": [], "bogi": null, "ch": null, "ans": [4], "ans_extra": "engaging → engage", "exp": [{"t": "txt", "v": "[동사 vs 준동사]"}, {"t": "txt", "v": "People (in today’s fast-paced society) engage in this either for necessity or for entertainment."}, {"t": "txt", "v": "동사가 들어가야 할 자리이다."}], "ko": "", "words": "⋅shrub 관목", "others": [["①", "that", "선행사 a method + 뒷문장 주어 없음 → 주격 관계대명사"], ["②", "be found", "food가 '발견되는' 수동 → 조동사 + be p.p."], ["③", "were", "Most of + 복수명사 the foods → were"], ["⑤", "beneficial", "find it C1 and C2 → 목적격보어 형용사"]], "ex": {}}, {"no": 38, "src": "교재 고1 #38", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Your parents may be afraid that you will not spend your allowance wisely. You may make some foolish spending choices, but if you <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>do<\/u><\/span>, the decision to do so is your own and hopefully you will learn from your mistakes. Much of learning     <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>occurs<\/u><\/span> through trial and error. Explain to your parents that money is something you will have to deal with for the rest of your life. It is better      <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>what<\/u><\/span> you make your mistakes early on rather than later in life. Explain that you will have a family someday and you need to know how <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>to manage<\/u><\/span> your money. Not everything <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>is taught<\/u><\/span> at school!"], "notes": [], "bogi": null, "ch": null, "ans": [3], "ans_extra": "", "exp": [{"t": "txt", "v": "[명사절 that vs 명사절 what]"}, {"t": "txt", "v": "It is better what you make your mistakes early on rather than later in life."}, {"t": "txt", "v": "가주어-진주어 구문으로 \"삶에서 나중보다 이른 시기에 실수를 저지르는 것이 더 낫다.\""}, {"t": "txt", "v": "뒷문장이 완전하므로 접속사 that이 와야 한다."}, {"t": "txt", "v": "you(주어) + make(동사) + your mistakes(목적어)"}], "ko": "", "words": "⋅allowance 용돈 ⋅choice 선택 ⋅decision 결정     ⋅hopefully 바라건대 ⋅occur 일어나다, 생기다 ⋅trial and error 시행착오 ⋅deal with ~을 처리하다 ⋅mistake 실수 ⋅early on 이른 시기에, 초기에 ⋅manage 관리하다", "others": [["①", "do", "앞의 make foolish spending choices 대신 → 대동사 do"], ["②", "occurs", "Much of + 불가산 learning(단수) → occurs"], ["④", "to manage", "의문사 how + to부정사 → 명사구"], ["⑤", "is taught", "주어 everything(단수)이 '가르쳐지는' 수동"]], "ex": {}}, {"no": 39, "src": "교재 고1 #39", "stem": "<b>다음 글의 괄호 (A), (B), (C) 안에서 어법에 맞는 표현으로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["A lot of customers buy products only after they are made aware that the products are available in the market. Let’s say a product, even if it has been out there for a while, is not <span class=\"br\"><span class=\"brl\">(A)<\/span>[advertising <i>/<\/i> advertised]<\/span>. Then what might happen? Not knowing that the product exists, customers would probably not buy it even if the product may have worked for <span class=\"br\"><span class=\"brl\">(B)<\/span>[it <i>/<\/i> them]<\/span>. Advertising also helps people find the best for themselves. When they are made aware of a whole range of goods, they are able to compare them and make purchases so that they get <span class=\"br\"><span class=\"brl\">(C)<\/span>[that <i>/<\/i> what]<\/span> they desire with their hard-earned money. Thus, advertising has become a necessity in everybody’s daily life."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["advertising", "it", "tha .S. market today, some of <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>them<\/u><\/span> use less than 1.3 gallons per flush. Starting at $200, these toilets are affordable and can help the average consumer save hundreds of gallons of water per year. Appliances <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>officially<\/u><\/span> approved as most efficient are tagged with the Energy Star logo to alert the shopper. Washing machines with that rating use 18 to 25 gallons of water per load, compared with older machines that use 40 gallons. High-efficiency dishwashers save     <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>even<\/u><\/span> more water. These machines use up to 50 percent less water than older models."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ans_extra": "them을 which로", "exp": [{"t": "txt", "v": "[them vs which] ★★★★★ 최근 빈출!!"}, {"t": "txt", "v": "동사가 2개라서 접속사의 역할과 대명사의 역할을 동시에 하는 관계대명사가 적절하다."}, {"t": "txt", "v": "More than 35 models of high-efficiency toilets are on the U.S. market today, some of ③them use less than 1.3 gallons per flush."}], "ko": "", "words": "⋅consciousness 의식 ⋅install 설치하다 ⋅approve 승인하다 ⋅alert 알리다", "others": [["①", "to save", "the cheapest way 수식 → to부정사 형용사적 용법"], ["②", "are", "there 구문 주어 plenty of devices(복수) → are"], ["④", "officially", "과거분사 approved 수식 → 부사"], ["⑤", "even", "비교급 more 강조 → even"]], "ex": {}}, {"no": 42, "src": "교재 고1 #42", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Take time to read the comics. This is worthwhile not just because they will make you laugh but <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>because<\/u><\/span> they contain wisdom about the nature of life. Charlie Brown and Blondie are part of my morning routine and help me <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>to start<\/u><\/span> the day with a smile. When you read the comics secti const SET_SIZE = 5;
const SYMS={'①':'①②③④⑤','ⓐ':'ⓐⓑⓒⓓⓔ'};
const SETS=[];
for(let i=0;i<PROBLEMS.length;i+=SET_SIZE) SETS.push(PROBLEMS.slice(i,i+SET_SIZE));
function setName(i){return 'Day '+(i+1);}
function sticker(k){return STICKERS[k]||STICKERS.a_00||'';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function symOf(p,k){return SYMS[p.sym][k-1];}
function gidx(p){return PROBLEMS.indexOf(p);}

let state=PROBLEMS.map(()=>({sel:[],solved:false,revealed:false,firstTryWrong:false}));
let curSet=0,cur=0,view='solve';
const setTabsEl=document.getElementById('setTabs'),probRowEl=document.getElementById('probRow'),stageEl=document.getElementById('stage');

/* progress */
const LSKEY='bareun_grammar_g1_v1';
function saveProgress(){try{localStorage.setItem(LSKEY,JSON.stringify({v:2,n:PROBLEMS.length,curSet,cur,view:(view==='score'?'score':'solve'),state}));}catch(e){}}
function loadProgress(){
  try{const raw=localStorage.getItem(LSKEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||d.n!==PROBLEMS.length)return false;
    d.state.forEach((s,i)=>{if(state[i])Object.assign(state[i],s);});
    curSet=Math.min(Math.max(d.curSet||0,0),SETS.length-1);cur=Math.min(Math.max(d.cur||0,0),PROBLEMS.length-1);
    if(d.view==='score'&&setDone(curSet))view='score';
    return state.some(s=>s.revealed||s.sel.length);
  }catch(e){return false;}
}
function resetProgress(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();}

/* nav */
function setDone(si){return SETS[si].every(p=>state[gidx(p)].revealed);}
function answeredN(si){return SETS[si].filter(p=>state[gidx(p)].sel.length===p.ans.length).length;}
function renderNav(){
  setTabsEl.innerHTML=SETS.map((s,si)=>'<div class="set-tab'+(si===curSet?' active':'')+(setDone(si)?' done':'')+'" data-s="'+si+'">'+setName(si)+' <span class="tab-sub">'+s[0].no+'~'+s[s.length-1].no+'번</span></div>').join('');
  const done=setDone(curSet);
  let chips='';
  SETS[curSet].forEach(p=>{const i=gidx(p),st=state[i];let cls='nav-chip';
    if(i===cur&&view==='solve')cls+=' active';
    if(done)cls+=st.solved?' solved':' wrongc';else if(st.sel.length===p.ans.length)cls+=' answered';
    chips+='<div class="'+cls+'" data-i="'+i+'"><span class="dot"></span><span class="nav-num">'+p.no+'</span></div>';});
  if(done){
    const wrongN=SETS[curSet].filter(p=>state[gidx(p)].firstTryWrong).length;
    setTabsEl.insertAdjacentHTML('beforeend','<div class="act-box"><button class="score-btn'+(view==='score'?' on':'')+'" id="scoreBtn">📊 결과</button></div>');
  }
  probRowEl.innerHTML=chips;
  setTabsEl.querySelectorAll('.set-tab').forEach(t=>t.addEventListener('click',()=>{curSet=+t.dataset.s;cur=gidx(SETS[curSet][0]);view=setDone(curSet)?'score':'solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}));
  probRowEl.querySelectorAll('.nav-chip').forEach(c=>c.addEventListener('click',()=>{cur=+c.dataset.i;view='solve';renderNav();renderStage();}));
  const sc=document.getElementById('scoreBtn');if(sc)sc.addEventListener('click',()=>{view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
  document.getElementById('pfootSet').textContent='바른그래머 고1 · '+setName(curSet);
}

/* 문항 지면 */
function questionHtml(p){
  let h='<div class="qtitle"><span class="qn">'+p.no+'.</span>'+p.stem+'<span class="qsrc">('+p.src+')</span>'
    +(p.ans.length>1?'<span class="multi-badge">정답 '+p.ans.length+'개</span>':'')+'</div>';
  h+='<div class="passage">'+p.p.map(x=>'<p>'+x+'</p>').join('')+'</div>';
  p.notes.forEach(n=>{h+='<div class="fn">'+n+'</div>';});
  if(p.bogi){h+='<div class="bogi"><div class="bogi-t">&lt;보기&gt;</div><div class="bogi-grid">'+p.bogi.map(b=>'<div>'+esc(b)+'</div>').join('')+'</div></div>';}
  if(p.kind==='list'){h+='<div class="clist">'+p.ch.items.map((it,i)=>'<div class="ch" data-k="'+(i+1)+'"><span class="cn">'+symOf(p,i+1)+'</span>'+esc(it)+'</div>').join('')+'</div>';}
  if(p.kind==='table'){
    h+='<table class="ctab"><tr><th></th>'+p.ch.head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'
      +p.ch.rows.map((r,i)=>'<tr class="ch" data-k="'+(i+1)+'"><td>'+symOf(p,i+1)+'</td>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
  }
  return h;
}
function paintMarks(p,st){
  const fin=st.revealed;
  stageEl.querySelectorAll('.qitem [data-k], .omr button').forEach(el=>{
    const k=+el.dataset.k;el.classList.remove('sel','ok','bad');
    if(fin){ if(p.ans.includes(k))el.classList.add('ok'); else if(st.sel.includes(k))el.classList.add('bad'); }
    else if(st.sel.includes(k))el.classList.add('sel');
  });
}
function toggle(p,st,k){
  if(st.revealed)return;
  const need=p.ans.length;
  if(need===1){st.sel=st.sel[0]===k?[]:[k];}
  else{ if(st.sel.includes(k))st.sel=st.sel.filter(x=>x!==k); else{st.sel.push(k);if(st.sel.length>need)st.sel.shift();} }
  st.sel.sort((a,b)=>a-b);paintMarks(p,st);renderNav();updateGradeRow();saveProgress();
}
function updateGradeRow(){
  const n=answeredN(curSet),tot=SETS[curSet].length;
  const g=document.getElementById('gradeBtn');if(g)g.disabled=n<tot;
  const c=document.getElementById('ansCount');if(c)c.innerHTML='고른 문항 <b>'+n+'</b> / '+tot;
}
function move(d){
  const s=SETS[curSet];const pos=s.indexOf(PROBLEMS[cur]);const np=pos+d;
  if(np<0||np>=s.length)return;cur=gidx(s[np]);view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});
}

function renderStage(){
  saveProgress();
  if(view==='score'){renderScore();return;}
  const p=PROBLEMS[cur],st=state[cur];const fin=st.revealed;
  const s=SETS[curSet];const pos=s.indexOf(p);
  let h='<div class="qitem'+(fin?' lock':'')+'">'+questionHtml(p)+'</div>';
  if(!fin){
    const syms=SYMS[p.sym];
    h+='<div class="notezone"><div class="note-label">MY ANSWER <span>· 답 고르기</span></div>'
      +'<div class="omr">'+[1,2,3,4,5].map(k=>'<button data-k="'+k+'">'+syms[k-1]+'</button>').join('')+'</div>'
      +'<div class="builder-hint">'+(p.kind==='mark'?'지문의 <b>밑줄 번호</b>를 눌러도 선택돼요. ':'위의 <b>선택지</b>를 눌러도 선택돼요. ')
      +(p.ans.length>1?'이 문항은 <b>'+p.ans.length+'개</b>를 골라야 해요. ':'')+'채점 전까지는 답을 바꿀 수 있어요.</div>'
      +'<div class="row"><button class="nextbtn" id="prevBtn"'+(pos===0?' disabled':'')+'>&larr; 이전</button>'
      +(pos<s.length-1?'<button class="submit" id="nextQ">다음 문항 &rarr;</button>':'')
      +'<span class="try-count" id="ansCount"></span></div>'
      +'<div class="grade-row"><button class="grade" id="gradeBtn" disabled>'+setName(curSet)+' 채점하기</button><span class="grade-hint">'+s.length+'문항을 모두 고르면 채점할 수 있어요. 채점하면 해설이 열려요.</span></div>'
      +'<img class="note-coffee" src="'+sticker('b_06')+'" alt=""></div>';
    h+='<div class="reaction"><img src="'+sticker('b_11')+'" alt=""><div class="bubble">끝까지 <b>시험 보듯</b> 풀어 보자! 5문항 다 고르고 한 번에 채점!</div></div>';
  }else{
    h+='<div class="myres '+(st.solved?'ok':'bad')+'"><span>내 답 <b>'+(st.sel.map(k=>symOf(p,k)).join(', ')||'-')+'</b></span><span class="v">'+(st.solved?'정답':'오답')+'</span></div>';
    h+=revealHtml(p,st.solved);
  }
  stageEl.innerHTML=h;
  stageEl.querySelectorAll('.qitem [data-k], .omr button').forEach(el=>el.addEventListener('click',()=>toggle(p,st,+el.dataset.k)));
  const pb=document.getElementById('prevBtn');if(pb)pb.addEventListener('click',()=>move(-1));
  const nq=document.getElementById('nextQ');if(nq)nq.addEventListener('click',()=>move(1));
  const gb=document.getElementById('gradeBtn');if(gb)gb.addEventListener('click',grade);
  const nb=document.getElementById('nextBtn');if(nb)nb.addEventListener('click',goNext);
  paintMarks(p,st);updateGradeRow();
}
function grade(){
  const s=SETS[curSet];if(answeredN(curSet)<s.length)return;
  if(!confirm('채점하면 답을 바꿀 수 없어요. 채점할까요?'))return;
  s.forEach(p=>{const st=state[gidx(p)];const ok=st.sel.length===p.ans.length&&st.sel.every(k=>p.ans.includes(k));
    st.solved=ok;st.revealed=true;st.firstTryWrong=!ok;});
  view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});
}
function noteGuideHtml(wrong){
  return '<div class="note-guide"><div class="ng-head"><span class="ng-t">오답노트 써 오기</span><span class="ng-nos">틀린 문항: '+wrong.map(p=>'<b>'+p.no+'번</b>').join(', ')+'</span></div>'
    +'<div class="ng-sub">해설을 보고 <b>일반 노트나 이면지</b>에 손으로 정리한 뒤, 사진을 찍어 숙제방에 올리세요. <span class="ng-warn">(오아시스 노트 X)</span><span class="ng-why">오아시스 노트는 선생님이 강조한 문법만 필기해서 여러 번 복습하는 노트예요. 오답노트는 따로 써 주세요.</span></div>'
    +'<ol class="ng-steps">'
    +'<li><b>문항 번호</b>를 쓴다. <span class="ng-eg">예) #02</span></li>'
    +'<li>정답만이 아니라 <b>모든 선지</b>를 한 줄씩: 기호 + 원래 → 고친 형태 + <b>O / X</b> + <b>[쟁점 태그]</b> <span class="ng-eg">예) ⓑ allowed → are allowed O [동사 vs 준동사]</span></li>'
    +'<li>그 아래 <b>해당 문장</b>을 옮겨 쓰고, 수식어는 <b>( )</b>로 묶고 판단할 자리는 <b>[ ]</b>로 표시한다.</li>'
    +'<li><b>빨간 펜</b>으로 근거를 적는다. <span class="ng-eg">예) 주어 + 동사, 조동사 + 동사원형, 사역동사 + 목적어 + 동사원형</span></li>'
    +'</ol>'
    +'<button class="ng-btn" id="noteEx">예시 노트 보기 ▾</button>'
    +'<div id="noteExWrap" hidden><img class="ng-img" src="'+NOTE_EX+'" alt="오답노트 예시"></div></div>';
}
function renderScore(){
  const s=SETS[curSet];const okN=s.filter(p=>state[gidx(p)].solved).length;const wrong=s.filter(p=>!state[gidx(p)].solved);
  const img=okN===s.length?'a_00':(okN>=s.length*0.7?'b_11':'b_14');
  const msg=okN===s.length?'<b>만점!</b> 해설로 다른 선지까지 확인하면 완벽!':'틀린 <b>'+wrong.length+'문항</b>부터 해설을 꼼꼼히 보자. 칸을 누르면 그 문항 해설로 바로 가.';
  let h='<div class="score-card"><div class="score-top"><img src="'+sticker(img)+'" alt=""><div><div class="score-t">'+setName(curSet)+' 채점 결과</div><div class="score-n"><b>'+okN+'</b> / '+s.length+'</div></div></div>'
    +'<div class="score-grid">'+s.map(p=>{const st=state[gidx(p)];return '<div class="sg '+(st.solved?'ok':'bad')+'" data-i="'+gidx(p)+'"><span class="sgn">'+p.no+'</span><span class="sgv">'+(st.solved?'O':'X')+'</span><span class="sga">내 답 '+st.sel.map(k=>symOf(p,k)).join(',')+(st.solved?'':' · 정답 '+p.ans.map(k=>symOf(p,k)).join(','))+'</span></div>';}).join('')+'</div>'
    +'<div class="bubble score-msg">'+msg+'</div>'
    +'<div class="kkam-done"><button class="big" id="firstExp">해설 보기 (처음부터)</button></div></div>'
    +(wrong.length?noteGuideHtml(wrong):'');
  stageEl.innerHTML=h;
  const nb=document.getElementById('noteEx');if(nb)nb.addEventListener('click',()=>{const w=document.getElementById('noteExWrap');w.hidden=!w.hidden;nb.textContent=w.hidden?'예시 노트 보기 ▾':'예시 노트 접기 ▴';});
  stageEl.querySelectorAll('.sg').forEach(el=>el.addEventListener('click',()=>{cur=+el.dataset.i;view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}));
  document.getElementById('firstExp').addEventListener('click',()=>{cur=gidx(s[0]);view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
}
function goNext(){
  const s=SETS[curSet];const pos=s.indexOf(PROBLEMS[cur]);
  if(pos<s.length-1)move(1);
  else{view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}
}
function enLine(t){
  // t may contain <b>; escape nothing else. Gray out ( ... ) groups, highlight [ ... ]
  let h=t.replace(/&lt;/g,'\u0001').replace(/&gt;/g,'\u0002');
  h=h.replace(/\[([^\]]+)\]/g,'<span class="tgt">[$1]</span>');
  // parentheses (non-nested-aware but balanced scan)
  let out='',depth=0;
  for(const ch of h){
    if(ch==='('){ if(depth===0)out+='<span class="par">'; depth++; out+=ch; }
    else if(ch===')'&&depth>0){ out+=ch; depth--; if(depth===0)out+='</span>'; }
    else out+=ch;
  }
  if(depth>0)out+='</span>';
  return out.replace(/\u0001/g,'&lt;').replace(/\u0002/g,'&gt;');
}
function isEn(t){const s=t.replace(/<[^>]+>/g,'');return !/[가-힣]/.test(s)&&/[A-Za-z]{3,}/.test(s)&&!/→/.test(s.slice(0,3));}
function coreHtml(c,compact){
  let h='<div class="cb">';
  if(c.tag)h+='<div class="cb-tag">['+c.tag+']</div>';
  h+='<div class="cb-fix"><span class="lab">'+c.key+'</span>'+c.fix+'</div>';
  const lines=c.lines||[];
  h+='<div class="cb-body">'+lines.map(l=>isEn(l)?'<div class="ln en">'+enLine(l)+'</div>':'<div class="ln">'+l+'</div>').join('')+'</div>';
  if(c.ko&&!compact)h+='<div class="cb-ko">“'+esc(c.ko)+'”</div>';
  return h+'</div>';
}
function tLine(v){
  const m=v.match(/^(\([A-E]\)\s*)?\[([^\]]+)\](.*)$/);
  if(m){return '<div class="t-tag">'+(m[1]?'<span class="lab">'+esc(m[1].trim())+'</span>':'')+'['+esc(m[2])+']'+(m[3].trim()?'<span class="t-tag-rest">'+fmtTxt(m[3].trim())+'</span>':'')+'</div>';}
  if(/^※/.test(v))return '<div class="t-memo">'+fmtTxt(v)+'</div>';
  if(isEn(v))return '<div class="ln en">'+enLine(esc(v))+'</div>';
  return '<div class="t-ln">'+fmtTxt(v)+'</div>';
}
function fmtTxt(v){return esc(v).replace(/(→)/g,'<b class="arr">$1</b>');}
function tTable(rows){return '<div class="t-tblw"><table class="t-tbl">'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th':'<td')+(i===0&&r.length<(rows[1]||r).length?' colspan="'+Math.round((rows[1]||r).length/r.length)+'"':'')+'>'+esc(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';}
function teacherHtml(p){
  let h='',star=false,box='';
  for(const it of p.exp){
    if(it.t==='tbl'){(star?(box+=tTable(it.rows)):(h+=tTable(it.rows)));continue;}
    const v=it.v;
    if(/^★+\s*$/.test(v)){ if(star){h+='<div class="t-star">'+box+'</div>';box='';star=false;} else star=true; continue; }
    if(star)box+=tLine(v); else h+=tLine(v);
  }
  if(star&&box)h+='<div class="t-star">'+box+'</div>';
  return h;
}
function revealHtml(p,solved){
  const s=SETS[curSet];const pos=s.indexOf(p);
  const nextLabel=pos<s.length-1?'다음 문항 해설 &rarr;':'채점 결과로 &rarr;';
  return '<div class="reveal"><div class="reveal-head"><img src="'+sticker(solved?'a_00':'b_14')+'" alt="">'+(solved?'정답입니다 · 강쌤 해설':'정답 공개 · 강쌤 해설')+'</div><div class="reveal-body">'
    +'<div class="ans-big">정답 <span>'+p.ans.map(k=>symOf(p,k)).join(', ')+'</span>'+(p.ans_extra&&!/^\[/.test(p.ans_extra)?'<em class="ans-x">'+esc(p.ans_extra)+'</em>':'')+'</div>'
    +'<div class="t-box">'+teacherHtml(p)+'</div>'
    +(p.others&&p.others.length?'<div class="sol-label">나머지 선지</div><div class="sol-sub">'+p.others.map(x=>'<p><span class="lab">'+x[0]+'</span><b class="ow">'+esc(x[1])+'</b>'+x[2]+'</p>').join('')+'</div>':'')
    +(p.ko?'<details class="t-ko"><summary>해석 보기</summary><p>'+esc(p.ko)+'</p></details>':'')
    +(p.words?'<div class="t-words">'+esc(p.words)+'</div>':'')
    +(nextLabel?'<div class="next-row"><button class="nextbtn" id="nextBtn">'+nextLabel+'</button></div>':'')
    +'</div></div>';
}
function kkamRef(p){return p.ex.core.map(c=>coreHtml(c,true)).join('')+(p.ex.summary?'<div class="sum-line">'+p.ex.summary+'</div>':'');}

function showResume(){
  const t=document.createElement('div');t.className='resume-toast';
  t.innerHTML='↩️ 지난 진행을 불러왔어요 · <b>'+setName(curSet)+' '+PROBLEMS[cur].no+'번</b>부터 이어서';
  document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),50);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4200);
}
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('지금까지의 진행 상황을 모두 지우고 처음부터 다시 시작할까요?'))resetProgress();});
const _restored=loadProgress();
renderNav();renderStage();
if(_restored)showResume();
</script>
</body>
